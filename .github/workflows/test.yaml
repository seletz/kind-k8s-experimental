name: test
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main, develop ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup mise
      uses: jdx/mise-action@v2
    - name: Validate GitOps configuration
      run: mise run validate
      shell: bash