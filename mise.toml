env_file = '.env'

[settings]
experimental = true
legacy_version_file = false # Don't auto-detect from .python-version files

[tools]
op = "latest"
helm = "latest"
kustomize = "latest"
kubeconform = "latest"
yq = "latest"

[env]
KUBECONFIG = "{{config_root}}/.kube/config"

[vars]
user = "seletz"
reponame = "kind-k8s-experimental"

[tasks.prepare_env]
description = "Prepare local .env from .env.1p"
run = "cat .env.1p | op inject > .env"

[tasks.prepare_kubeconfig]
description = "Prepare local kind kubeconfig file"
run = "kind get kubeconfig --name experimental > .kube/config"


[tasks.flux_bootstrap]
run = """GITHUB_TOKEN=$(gh auth token) flux bootstrap github \
  --owner={{vars.user}} \
  --repository={{vars.reponame}} \
  --branch=develop \
  --path=clusters/local-kind \
  --components source-controller,kustomize-controller,helm-controller,notification-controller \
  --components-extra image-reflector-controller,image-automation-controller \
  --personal
"""

[tasks.flux_check]
run = "flux check"

[tasks.flux_kustomisations]
run = "flux get kustomizations"

[tasks.create_cluster]
description = "Create kind cluster with experimental configuration"
run = "kind create cluster --config kind-config.yml --name experimental"

[tasks.delete_cluster]
description = "Delete kind cluster"
run = "kind delete cluster --name experimental"

[tasks.validate]
description = "Validate all GitOps configuration locally"
run = "./scripts/validate.sh"

[tasks.port_forward_all]
description = "Start port-forwards for all services (Grafana, Prometheus, Alertmanager, Headlamp)"
run = """
echo "🚀 Starting port-forwards for all services..."
echo "  → Grafana: http://localhost:3000"
echo "  → Prometheus: http://localhost:9090"
echo "  → Alertmanager: http://localhost:9093"
echo "  → Headlamp: http://localhost:8080"
echo ""
echo "To stop all port-forwards: pkill -f 'kubectl port-forward'"
echo ""

# Start all port-forwards in background
kubectl port-forward -n monitoring service/kube-prometheus-stack-grafana 3000:80 &
kubectl port-forward -n monitoring service/kube-prometheus-stack-prometheus 9090:9090 &
kubectl port-forward -n monitoring service/kube-prometheus-stack-alertmanager 9093:9093 &
kubectl port-forward -n headlamp-system service/headlamp-system-headlamp 8080:80 &

echo "✅ All port-forwards started!"
echo ""
echo "📋 Access credentials:"
echo "  Grafana: admin/$(kubectl get secret -n monitoring kube-prometheus-stack-grafana -o jsonpath="{.data.admin-password}" | base64 -d)"
echo "  Headlamp: Use token from 'mise run headlamp_token'"
"""

[tasks.headlamp_token]
description = "Get Headlamp access token an put it into the clipboard"
run = "kubectl get secret headlamp-admin-token -n headlamp-system -o jsonpath='{.data.token}' | base64 -d | pbcopy"
