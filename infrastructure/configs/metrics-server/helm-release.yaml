---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
  namespace: flux-system
spec:
  interval: 10m
  targetNamespace: kube-system
  chart:
    spec:
      chart: metrics-server
      version: '>=3.13.0'
      sourceRef:
        kind: HelmRepository
        name: metrics-server
        namespace: flux-system
      interval: 5m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Kind cluster compatibility - add kubelet-insecure-tls flag
    args:
      - --kubelet-insecure-tls
    
    # Standard Kubernetes labels
    commonLabels:
      app.kubernetes.io/component: metrics-server
      app.kubernetes.io/part-of: management-platform