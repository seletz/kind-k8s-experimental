---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 10m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: '>=65.0.0'
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 5m
  install:
    createNamespace: false  # Namespace created by operator install
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # CRDs and operator already installed in controllers phase
    crds:
      enabled: false
    prometheusOperator:
      enabled: false
    
    # Enable monitoring components
    prometheus:
      enabled: true
      prometheusSpec:
        # Disable restrictive label matching to discover all PodMonitors
        podMonitorSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        podMonitorSelector: {}  # Now truly selects all PodMonitors
    alertmanager:
      enabled: true
    grafana:
      enabled: true
    nodeExporter:
      enabled: true
    kubeStateMetrics:
      enabled: true