---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: flux-system
spec:
  interval: 10m
  targetNamespace: headlamp-system
  chart:
    spec:
      chart: headlamp
      version: '>=0.34.0'
      sourceRef:
        kind: HelmRepository
        name: headlamp
        namespace: flux-system
      interval: 5m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Configure for in-cluster deployment
    config:
      inCluster: true
      pluginsDir: /build/plugins
    
    # Enable Flux plugin via initContainer
    initContainers:
      - name: headlamp-plugins
        image: ghcr.io/headlamp-k8s/headlamp-plugin-flux:latest
        imagePullPolicy: Always
        command:
          - /bin/sh
          - -c
          - mkdir -p /build/plugins && cp -r /plugins/* /build/plugins/
        volumeMounts:
          - name: plugins-volume
            mountPath: /build
    
    # Add volume for plugin sharing
    volumes:
      - name: plugins-volume
        emptyDir: {}
    
    # Mount plugin volume in main container
    volumeMounts:
      - name: plugins-volume
        mountPath: /build
    
    # RBAC configuration
    serviceAccount:
      create: true
      name: headlamp-admin
    
    clusterRoleBinding:
      create: true
      clusterRoleName: cluster-admin
    
    # Security context
    securityContext:
      runAsNonRoot: true
      runAsUser: 100
      runAsGroup: 101